# Deploys the web app to Vercel: every PR gets a preview, and main updates the dev site.
# The only link to Vercel is the VERCEL_TOKEN repo secret (see docs/process.md).
name: Deploy

# Only changes that can alter the site deploy, so docs-only PRs don't use up Vercel's free quota.
on:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/deploy.yml

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT: heynewton-web
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    # Forks can't read repo secrets, so their PRs get no preview.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'dev' || 'preview' }}
      # The dev site's address (#106); previews link to their own deployment.
      url: ${{ github.event_name == 'push' && 'https://dev.heynewton.app' || steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # main deploys to Vercel's "production" target, which has the stable URL; it is our dev site.
      VERCEL_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      # The dev site and every preview sign in against the hosted dev database, newton-dev (#62).
      # Repo variables, not secrets: the publishable key is public by design and RLS protects the
      # data. Unset, the site builds and deploys anyway and sign-in shows as unavailable.
      SUPABASE_URL: ${{ vars.SUPABASE_DEV_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_DEV_PUBLISHABLE_KEY }}
      # "Sign in as…" the sample boat's people, whose addresses get no email (#97). This workflow
      # only deploys the dev site and previews, so production never has it. It also needs
      # SUPABASE_SECRET_KEY of newton-dev in Vercel (docs/tokens.md).
      FIXTURE_SIGN_IN: "1"
      # X-Robots-Tag: noindex on every page (next.config.ts), so search engines skip the dev site
      # and previews (#106). Read at build time only. Production never sets it.
      NOINDEX: "1"
    steps:
      # Only a publishable key may reach a deployment. A secret key bypasses row-level security.
      - name: Check the Supabase key is publishable
        run: |
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::SUPABASE_DEV_PUBLISHABLE_KEY must be a publishable key (sb_publishable_...)."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global vercel@64.5.0

      - name: Link the Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      # The app lives in apps/web of an npm workspace, so Vercel builds from the repo root with
      # apps/web as the project's root directory. Previews only ever hold fake data, so anyone
      # with the link can open them (Vercel Authentication off).
      - name: Configure the Vercel project
        run: |
          project_id=$(jq -r .projectId .vercel/project.json)
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/web","ssoProtection":null}' \
            "https://api.vercel.com/v9/projects/$project_id" > /dev/null

      - run: vercel pull --yes --environment "$VERCEL_TARGET" --token "$VERCEL_TOKEN"
      # The build reads SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, FIXTURE_SIGN_IN and NOINDEX from the
      # job's environment.
      - run: vercel build --target "$VERCEL_TARGET" --token "$VERCEL_TOKEN"

      # A prebuilt deployment doesn't keep the build's environment, so the server gets the same
      # values at run time with --env. Secret keys come from the Vercel dashboard (docs/tokens.md).
      - name: Deploy
        id: deploy
        run: |
          runtime_env=()
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            runtime_env=(--env "SUPABASE_URL=$SUPABASE_URL" --env "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
              --env "FIXTURE_SIGN_IN=$FIXTURE_SIGN_IN")
          fi
          url=$(vercel deploy --prebuilt --archive=tgz --target "$VERCEL_TARGET" "${runtime_env[@]}" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
