# Releases to production when a maintainer publishes a GitHub Release (#163): newton-prod gets the
# checked-in migrations of the release's tag, then the web app is deployed to the Vercel project
# heynewton-prod against it. A merge to main never releases: it only updates dev. newton-prod is
# never seeded. Fixture sign-in is never on here: the release fails if anything sets FIXTURE_SIGN_IN.
#
# Publishing is the approval. `verify` (no secrets) refuses a tag that isn't a calendar tag with a
# published, non-prerelease GitHub Release, or whose commit isn't on main or didn't pass on dev
# (scripts/release-check.mjs). `release` (environment `production`, which holds every prod key)
# lists the migrations newton-prod hasn't applied in the run summary, applies them, and deploys.
#
# Run workflow (from main, with a tag) releases a published tag again: to retry a failed release,
# or to roll back to an earlier one. A rollback puts the old code back; migrations stay applied.
name: Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example 2026.10.21), already published as a GitHub Release
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

# One release at a time. While one runs, the next one queues behind it; a newer one replaces an
# older one in the queue.
concurrency:
  group: production
  cancel-in-progress: false

env:
  VERCEL_PROJECT: heynewton-prod
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Check the release tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      # Run workflow only from main: on another branch its own copy of this file would run.
      - name: Started from a release or from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Production workflow from main, not $GITHUB_REF_NAME."
          exit 1
      # Full history and tags: the dev check looks for the last commit up to the tag that changed
      # the app.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # The script only uses Node's built-ins and gh, so no npm ci.
      - name: Tag is published, on main and passed on dev
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node scripts/release-check.mjs "$TAG"

  release:
    name: Migrate and deploy production
    needs: verify
    runs-on: ubuntu-latest
    # The environment only allows main and release tags, and has no required reviewer: publishing
    # the release was the approval.
    environment:
      name: production
      url: ${{ vars.PROD_SITE_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Environment variables of `production`, not repo variables: dev's values never reach here.
      SUPABASE_URL: ${{ vars.SUPABASE_PROD_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PROD_PUBLISHABLE_KEY }}
      SHA: ${{ needs.verify.outputs.sha }}
      TAG: ${{ needs.verify.outputs.tag }}
      # The footer embeds the published release tag and its verified commit at build time.
      NEXT_PUBLIC_NEWTON_BUILD_SHA: ${{ needs.verify.outputs.sha }}
      NEXT_PUBLIC_NEWTON_RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Check the prod settings
        env:
          DEV_URL: ${{ vars.SUPABASE_DEV_URL }}
          PROJECT_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
          SITE: ${{ vars.PROD_SITE_URL }}
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY PROJECT_REF SITE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not set in the production environment: ${missing[*]} (see docs/tokens.md)."
            exit 1
          fi
          # Only a publishable key may reach a deployment. A secret key bypasses row-level security.
          if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::SUPABASE_PROD_PUBLISHABLE_KEY must be a publishable key (sb_publishable_...)."
            exit 1
          fi
          if [ "$SUPABASE_URL" = "$DEV_URL" ] || [[ "$SUPABASE_URL" != *"$PROJECT_REF"* ]]; then
            echo "::error::SUPABASE_PROD_URL must be newton-prod's URL, not newton-dev's."
            exit 1
          fi

      # The commit verify checked, not the tag, in case the tag moved since.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Link newton-prod
        run: npx supabase link --project-ref "${{ vars.SUPABASE_PROD_PROJECT_REF }}"

      # For the record, not a gate: the release notes listed them and publishing approved them.
      # A rollback to an older tag finds migrations newton-prod has that this commit doesn't: they
      # stay applied, and only the code goes back.
      - name: Migrations newton-prod hasn't applied
        id: pending
        run: |
          pending=$(NEWER_FILE=newer.txt .github/scripts/pending-migrations.sh --linked)
          count=$(grep -c . <<<"$pending" || true)
          newer=$(grep -c . newer.txt || true)
          {
            if [ "$newer" != 0 ]; then
              echo "**Rollback: newton-prod has $newer migration(s) newer than $TAG.** They stay applied (migrations don't roll back); only the code goes back:"
              echo
              sed 's/^/- /' newer.txt
              echo
            fi
            if [ "$count" = 0 ]; then
              echo "No migrations to apply to newton-prod."
            else
              echo "**$count migration(s) to apply to newton-prod:**"
              echo
              while read -r name; do
                echo "- [$name]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$SHA/supabase/migrations/$name)"
              done <<<"$pending"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Older than prod and new migrations at once can't be right: db push would refuse it too.
          if [ "$newer" != 0 ] && [ "$count" != 0 ]; then
            echo "::error::$TAG has migrations newton-prod hasn't applied, but newton-prod also has newer ones. Release a newer tag."
            exit 1
          fi
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
      # Migrations only. Never --include-seed, never psql -f seed.sql, never seed buckets. Skipped on
      # a rollback, where there is nothing to apply and db push refuses the newer versions.
      - name: Migrations that will apply
        if: steps.pending.outputs.newer == '0'
        run: npx supabase db push --linked --dry-run --yes
      - name: Apply migrations
        if: steps.pending.outputs.newer == '0'
        run: npx supabase db push --linked --yes

      - run: npm install --global vercel@64.5.0
      - name: Link the Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
      # Root directory and framework as for the dev project. Vercel Authentication keeps its default (the
      # production URL is public, other deployment URLs need a Vercel login).
      - name: Configure the Vercel project
        run: |
          project_id=$(jq -r .projectId .vercel/project.json)
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/web","framework":"nextjs"}' \
            "https://api.vercel.com/v9/projects/$project_id" > /dev/null

      - run: vercel pull --yes --environment production --token "$VERCEL_TOKEN"
      # The project's own env vars (secret keys, set in the Vercel dashboard) must not turn on
      # fixture sign-in either.
      - name: Check fixture sign-in is off
        run: |
          if [ -n "${FIXTURE_SIGN_IN:-}" ] || grep -q '^FIXTURE_SIGN_IN=' .vercel/.env.production.local 2>/dev/null; then
            echo "::error::FIXTURE_SIGN_IN is set for production. Remove it from heynewton-prod's environment variables."
            exit 1
          fi
      # Nor hide prod from search engines: NOINDEX is only for the dev site and previews (#106).
      - name: Check noindex is off
        run: |
          if [ -n "${NOINDEX:-}" ] || grep -q '^NOINDEX=' .vercel/.env.production.local 2>/dev/null; then
            echo "::error::NOINDEX is set for production. Remove it from heynewton-prod's environment variables."
            exit 1
          fi
      - run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        run: |
          vercel deploy --prebuilt --archive=tgz --prod \
            --env "SUPABASE_URL=$SUPABASE_URL" --env "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --token "$VERCEL_TOKEN"

      # The sample boat's people must not be able to sign in on production.
      - name: Fixture sign-in answers 404
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            --data-urlencode "email=alex@example.com" "${{ vars.PROD_SITE_URL }}/auth/fixture-sign-in")
          if [ "$status" != "404" ]; then
            echo "::error::/auth/fixture-sign-in answered $status on production, expected 404."
            exit 1
          fi
          echo "Released $TAG ($SHA) to ${{ vars.PROD_SITE_URL }}." >> "$GITHUB_STEP_SUMMARY"
